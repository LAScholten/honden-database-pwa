<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hondendatabase - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="img/icons/icon-192x192.png">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center min-vh-100 align-items-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-primary text-white text-center py-4">
                        <h1 class="h3 mb-0">
                            <i class="bi bi-database"></i> Hondendatabase
                        </h1>
                        <p class="mb-0 mt-2">Interactieve hondenbeheer applicatie</p>
                    </div>
                    <div class="card-body p-4">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="bi bi-person"></i> Gebruikersnaam
                                </label>
                                <input type="text" class="form-control form-control-lg" 
                                       id="username" required autocomplete="username">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-key"></i> Wachtwoord
                                </label>
                                <input type="password" class="form-control form-control-lg" 
                                       id="password" required autocomplete="current-password">
                            </div>
                            <div class="mb-4">
                                <label for="role" class="form-label">
                                    <i class="bi bi-shield"></i> Rol
                                </label>
                                <select class="form-select form-select-lg" id="role">
                                    <option value="user">Gebruiker</option>
                                    <option value="admin">Administrator</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="bi bi-box-arrow-in-right"></i> Inloggen
                            </button>
                        </form>
                        
                        <div class="mt-4 pt-3 border-top">
                            <div class="alert alert-info mb-0">
                                <small>
                                    <i class="bi bi-info-circle"></i>
                                    <strong>Demo accounts:</strong><br>
                                    Admin: admin / admin123<br>
                                    Gebruiker: user / user123
                                </small>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-center py-3">
                        <small class="text-muted">
                            <i class="bi bi-shield-check"></i>
                            Beveiligde PWA applicatie - Offline beschikbaar
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Login functionaliteit
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            
            const result = await auth.login(username, password, role);
            
            if (result.success) {
                // Redirect naar hoofdapplicatie
                window.location.href = 'app.html';
            } else {
                alert('Login mislukt: ' + result.message);
            }
        });
    </script>
</body>
</html>
